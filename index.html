<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banking Products Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<!--
README
Tech: plain HTML + CSS + vanilla JS, no build step. One file, one screen.
Data vs UI: the PRODUCTS array is the "mock API" payload; fetchProducts() simulates
an async GET /api/products. Swap its body for a real fetch() and the UI is unchanged.
UI layer: state {category, query, status} -> filter() -> render(). Cards are built
by one function, so adding a product type only needs a new data row + category tab.
-->
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f6; --surface:#fff; --ink:#14213d; --muted:#5b667a; --line:#d6dde8;
  --accent:#14213d; --on-accent:#fff; --apply:#f2a900; --on-apply:#14213d;
  --ok:#0f7b5f; --ok-bg:#dcf3ea; --warn:#9a5b00; --warn-bg:#fdecc8; --off:#555e6e; --off-bg:#e4e8ee;
  --c-acc:#2f6fed; --c-card:#c2410c; --c-loan:#7c3aed; --c-wealth:#0f7b5f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1522; --surface:#172033; --ink:#e8edf6; --muted:#9aa6bb; --line:#27324a;
  --accent:#e8edf6; --on-accent:#0e1522; --apply:#f2b63a; --on-apply:#0e1522;
  --ok:#5fd3b0; --ok-bg:#12382f; --warn:#f5c26b; --warn-bg:#3b2d10; --off:#b2bbcb; --off-bg:#26314a;
  --c-acc:#7aa5ff; --c-card:#ff9a6b; --c-loan:#b79bff; --c-wealth:#5fd3b0; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1522; --surface:#172033; --ink:#e8edf6; --muted:#9aa6bb; --line:#27324a;
  --accent:#e8edf6; --on-accent:#0e1522; --apply:#f2b63a; --on-apply:#0e1522;
  --ok:#5fd3b0; --ok-bg:#12382f; --warn:#f5c26b; --warn-bg:#3b2d10; --off:#b2bbcb; --off-bg:#26314a;
  --c-acc:#7aa5ff; --c-card:#ff9a6b; --c-loan:#b79bff; --c-wealth:#5fd3b0; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--apply);outline-offset:2px}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
header h1{margin:0;font-size:clamp(1.7rem,5vw,2.6rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
header p{margin:6px 0 0;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 14px;align-items:center}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:1 1 100%}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:600}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tab span{opacity:.65;font-weight:400;margin-left:4px}
.field{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
select.field{flex:0 1 180px}
.count{color:var(--muted);margin:0 0 12px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--cat);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.cat{color:var(--cat);font-weight:600;font-size:.85rem;margin:0}
.card h2{margin:2px 0 0;font-size:1.15rem;line-height:1.25}
.badge{font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-active{background:var(--ok-bg);color:var(--ok)}
.s-available{background:var(--warn-bg);color:var(--warn)}
.s-closed{background:var(--off-bg);color:var(--off)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0}
.metrics div{border-left:2px solid var(--line);padding-left:10px}
.metrics dt{color:var(--muted);font-size:.8rem}
.metrics dd{margin:2px 0 0;font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.cta{margin-top:auto;border:0;border-radius:10px;padding:11px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--on-accent)}
.cta.apply{background:var(--apply);color:var(--on-apply)}
.cta:hover{filter:brightness(1.08)}
.state{text-align:center;color:var(--muted);padding:48px 12px;border:1px dashed var(--line);border-radius:14px}
.state button{margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:22px;max-width:min(420px,92vw)}
dialog::backdrop{background:rgba(10,15,25,.55)}
dialog h3{margin:0 0 4px}
dialog p{color:var(--muted)}
dialog .cta{width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--on-accent);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Your banking products</h1>
    <p>Accounts, cards, loans and investments in one place.</p>
  </header>

  <section class="tools" aria-label="Filters">
    <div class="tabs" id="tabs" role="group" aria-label="Product category"></div>
    <input class="field" id="q" type="search" placeholder="Search products" aria-label="Search products">
    <select class="field" id="status" aria-label="Filter by status">
      <option value="">All statuses</option>
      <option>Active</option><option>Available</option><option>Closed</option>
    </select>
  </section>

  <p class="count" id="count" aria-live="polite"></p>
  <ul class="grid" id="grid"></ul>
  <div id="state"></div>
</main>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- DATA LAYER (mock API) ---------- */
const PRODUCTS = [
  {id:1,name:"Everyday Savings",category:"Accounts",status:"Active",metrics:[["Interest rate","3.10% p.a."],["Balance","$12,480"]],desc:"Instant access savings with no monthly fee."},
  {id:2,name:"Checking Plus",category:"Accounts",status:"Active",metrics:[["Balance","$2,915"],["Monthly fee","$0"]],desc:"Everyday spending account with a debit card."},
  {id:3,name:"Goal Saver",category:"Accounts",status:"Available",metrics:[["Interest rate","4.25% p.a."],["Minimum","$100"]],desc:"Set a target and save towards it automatically."},
  {id:4,name:"Platinum Rewards Card",category:"Cards",status:"Active",metrics:[["Available limit","$7,200"],["Next due","Nov 18"]],desc:"2x points on travel and dining."},
  {id:5,name:"Cashback Card",category:"Cards",status:"Available",metrics:[["Cashback","1.5%"],["Annual fee","$0"]],desc:"Flat cashback on every purchase."},
  {id:6,name:"Home Loan",category:"Loans",status:"Active",metrics:[["Outstanding","$248,300"],["Next due","Nov 05"]],desc:"25-year fixed rate mortgage."},
  {id:7,name:"Personal Loan",category:"Loans",status:"Available",metrics:[["From rate","6.9% p.a."],["Up to","$40,000"]],desc:"Quick decision, no early repayment fees."},
  {id:8,name:"Auto Loan",category:"Loans",status:"Closed",metrics:[["Paid off","Mar 2026"],["Total repaid","$18,400"]],desc:"This loan has been fully repaid."},
  {id:9,name:"Index Growth Fund",category:"Wealth",status:"Active",metrics:[["Value","$21,060"],["1-year return","+8.4%"]],desc:"Low-cost diversified global index fund."},
  {id:10,name:"12-Month Term Deposit",category:"Wealth",status:"Available",metrics:[["Interest rate","4.60% p.a."],["Minimum","$1,000"]],desc:"Lock in a fixed rate for a year."}
];
const CATEGORIES = ["All","Accounts","Cards","Loans","Wealth"];
const COLORS = {Accounts:"--c-acc",Cards:"--c-card",Loans:"--c-loan",Wealth:"--c-wealth"};

// Simulates GET /api/products. Replace with fetch("/api/products").then(r => r.json()).
const fetchProducts = () => new Promise(res => setTimeout(() => res(PRODUCTS), 350));

/* ---------- UI LAYER ---------- */
const $ = id => document.getElementById(id);
const state = {all:[], category:"All", query:"", status:""};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ctaLabel = p => p.status === "Available" ? "Apply" : p.status === "Active" ? "View details" : "View history";

function filtered(){
  const q = state.query.trim().toLowerCase();
  return state.all.filter(p =>
    (state.category === "All" || p.category === state.category) &&
    (!state.status || p.status === state.status) &&
    (!q || (p.name + " " + p.category).toLowerCase().includes(q)));
}

function renderTabs(){
  $("tabs").innerHTML = CATEGORIES.map(c => {
    const n = c === "All" ? state.all.length : state.all.filter(p => p.category === c).length;
    return `<button class="tab" data-cat="${c}" aria-pressed="${c === state.category}">${c}<span>${n}</span></button>`;
  }).join("");
}

function card(p){
  return `<li class="card" style="--cat:var(${COLORS[p.category]})">
    <div class="top"><div><p class="cat">${esc(p.category)}</p><h2>${esc(p.name)}</h2></div>
    <span class="badge s-${p.status.toLowerCase()}">${p.status}</span></div>
    <dl class="metrics">${p.metrics.map(m => `<div><dt>${esc(m[0])}</dt><dd>${esc(m[1])}</dd></div>`).join("")}</dl>
    <button class="cta ${p.status === "Available" ? "apply" : ""}" data-id="${p.id}">${ctaLabel(p)}</button>
  </li>`;
}

function render(){
  const list = filtered();
  $("grid").innerHTML = list.map(card).join("");
  $("count").textContent = `${list.length} of ${state.all.length} products`;
  $("state").innerHTML = list.length ? "" :
    `<div class="state">No products match your filters.<br><button id="reset">Clear filters</button></div>`;
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200);
}

function openDetails(p){
  const d = $("dlg");
  d.innerHTML = `<h3>${esc(p.name)}</h3><p>${esc(p.category)} · ${p.status}</p><p>${esc(p.desc)}</p>
    <dl class="metrics">${p.metrics.map(m => `<div><dt>${esc(m[0])}</dt><dd>${esc(m[1])}</dd></div>`).join("")}</dl>
    <p></p><button class="cta ${p.status === "Available" ? "apply" : ""}" id="go">${p.status === "Available" ? "Start application" : "Close"}</button>`;
  d.showModal();
  $("go").onclick = () => { d.close(); if (p.status === "Available") toast(`Application started for ${p.name}`); };
}

/* ---------- Events ---------- */
$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  state.category = b.dataset.cat; renderTabs(); render();
});
$("q").addEventListener("input", e => { state.query = e.target.value; render(); });
$("status").addEventListener("change", e => { state.status = e.target.value; render(); });
$("grid").addEventListener("click", e => {
  const b = e.target.closest(".cta"); if (!b) return;
  openDetails(state.all.find(p => p.id === +b.dataset.id));
});
$("state").addEventListener("click", e => {
  if (e.target.id !== "reset") return;
  Object.assign(state, {category:"All", query:"", status:""});
  $("q").value = ""; $("status").value = ""; renderTabs(); render();
});
$("dlg").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

/* ---------- Boot ---------- */
$("state").innerHTML = `<div class="state">Loading your products…</div>`;
fetchProducts().then(data => { state.all = data; renderTabs(); render(); })
  .catch(() => { $("state").innerHTML = `<div class="state">We couldn’t load your products. Refresh to try again.</div>`; });
</script>
</body>
</html>
